<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="256" y1="48" x2="256" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="256" y1="80" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="256" y1="280" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Full Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Accent Border Outer Badge (Royal Blue & Electric Cyan) -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#accentGrad)" />

  <!-- Inner Dark Metallic Plate -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="url(#plateGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Monogram GTA -->
  <text x="256" y="240" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="148" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">GTA</text>

  <!-- Subtitle GARAGE (Royal Blue Highlight) -->
  <text x="256" y="324" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="56" fill="url(#blueGrad)" text-anchor="middle" letter-spacing="6">GARAGE</text>

  <!-- Subtitle POS BENGKEL -->
  <text x="256" y="388" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#94a3b8" text-anchor="middle" letter-spacing="4">POS BENGKEL</text>
</svg>
