<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14161c" />
      <stop offset="100%" stop-color="#090a0e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#d94600" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="256" y1="48" x2="256" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1e24" />
      <stop offset="100%" stop-color="#0d0e11" />
    </linearGradient>
    <linearGradient id="textGrad" x1="256" y1="80" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="256" y1="280" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Full Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Accent Border Outer Badge -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#accentGrad)" />

  <!-- Inner Dark Plate -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="url(#plateGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Monogram GTA -->
  <text x="256" y="240" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="148" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">GTA</text>

  <!-- Subtitle GARAGE -->
  <text x="256" y="324" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="56" fill="url(#orangeGrad)" text-anchor="middle" letter-spacing="6">GARAGE</text>

  <!-- Subtitle POS BENGKEL -->
  <text x="256" y="388" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#9ca3af" text-anchor="middle" letter-spacing="4">POS BENGKEL</text>
</svg>
